name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native sharing protocol
        shell: pwsh
        run: cargo test --locked --manifest-path share-core/Cargo.toml
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Run layout, arrangement, selection, context-routing, lock, caption, thumbnail, startup and display checks
        shell: pwsh
        run: |
          foreach ($check in @('self-test','membership-test','arrangement-test','selection-test','context-routing-test','lock-test','chrome-test','thumbnail-test','startup-test','display-test')) {
            $report = Join-Path $env:RUNNER_TEMP ($check+'.json')
            $process = Start-Process -FilePath './build/stage/DesktopBaskets.exe' -ArgumentList @(('--'+$check),'--work',('"'+$env:RUNNER_TEMP+'"'),'--report',('"'+$report+'"')) -Wait -PassThru -WindowStyle Hidden
            if (Test-Path $report) { Get-Content $report }
            if ($process.ExitCode -ne 0 -or !(Test-Path $report) -or !(Get-Content $report -Raw | ConvertFrom-Json).Passed) { throw ($check+' failed.') }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBaskets-Windows-x64
          path: dist/*.zip
