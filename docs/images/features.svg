<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Desktop Baskets 三項核心功能</title>
  <desc id="desc">原位保留：只改視覺歸屬。框選整理：多選拖曳與原生右鍵。玻璃工作區：格數縮放、磁吸與位置鎖定。</desc>
  <rect width="1200" height="190" fill="#171b1e"/>
  <g fill="#20262a" stroke="#4d595f"><path d="M14 15h366v145l-15 15H14z"/><path d="M411 15h366v145l-15 15H411z"/><path d="M808 15h378v145l-15 15H808z"/></g>
  <g fill="#fffa00"><rect x="14" y="15" width="3" height="44"/><rect x="411" y="15" width="3" height="44"/><rect x="808" y="15" width="3" height="44"/></g>
  <g font-family="Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#fffa00"><text x="38" y="46">01 / PATH: ORIGINAL</text><text x="435" y="46">02 / MULTI SELECT</text><text x="832" y="46">03 / GLASS WORKSPACE</text></g>
  <g font-family="Segoe UI,Microsoft JhengHei UI,Arial,sans-serif" fill="#eff3f5" font-size="27" font-weight="700"><text x="37" y="92">原位保留</text><text x="434" y="92">框選，一起整理</text><text x="831" y="92">桌面上的工作區</text></g>
  <g font-family="Segoe UI,Microsoft JhengHei UI,Arial,sans-serif" fill="#acb9c1" font-size="15"><text x="38" y="131">只改視覺歸屬，不搬動原檔。</text><text x="435" y="131">跨籃拖曳・原生多選右鍵</text><text x="832" y="131">格數縮放・磁吸・位置鎖定</text></g>
</svg>
