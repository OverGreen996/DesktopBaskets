    <text x="188" y="73" fill="#acb8bf" font-size="12" letter-spacing="3.5">LOCAL / YOUR DESKTOP</text>
    <text x="184" y="123" fill="#f2f5f7" font-size="51" font-weight="900" letter-spacing="-.8">DESKTOP BASKETS</text>
