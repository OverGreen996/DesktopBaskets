<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Desktop Baskets — 讓桌面有秩序，讓檔案留在原位</title>
  <desc id="desc">深色背景、細切角邊框與黃色旗角，呈現 Windows 原生桌面分類工具的視覺識別。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#24292c"/><stop offset="1" stop-color="#111516"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#555e60" opacity=".35"/></pattern>
  </defs>
  <rect width="1200" height="350" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="314" fill="url(#dots)"/>
  <g stroke="#6e7779" fill="none">
