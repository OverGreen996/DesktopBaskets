    <text x="64" y="65" fill="#b5c0c4" font-size="13" letter-spacing="4">LOCAL / DESKTOP ORGANIZER</text>
    <text x="60" y="151" fill="#edf0f2" font-size="68" font-weight="800" letter-spacing="-2">DESKTOP BASKETS</text>
    <text x="64" y="201" fill="#edf0f2" font-size="26" font-weight="600">讓桌面有秩序，讓檔案留在原位。</text>
    <text x="65" y="239" fill="#b5c0c4" font-size="16">暗色玻璃整理框 · 自由分類 · 格數縮放 · 磁吸對齊</text>
